<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Christmas Tree</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04060d;
  }
  body {
    background: radial-gradient(ellipse at 50% 35%, #18223d 0%, #0a0f1f 45%, #04060d 85%);
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  .mailbox {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 210, 110, .45);
    background: rgba(13, 20, 39, .85);
    color: #ffd978;
    font: 600 14px 'DejaVu Sans Mono', Menlo, Consolas, monospace;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(255, 190, 70, .2);
  }
  .mailbox:hover { background: rgba(25, 34, 60, .95); }
  .mailbox .icon { font-size: 22px; line-height: 1; }
  @media (max-width: 600px) {
    .mailbox { padding: 10px; }
    .mailbox .label { display: none; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(2, 4, 10, .6);
    backdrop-filter: blur(3px);
  }
  .overlay[hidden], .card[hidden] { display: none; }
  .card {
    box-sizing: border-box;
    width: min(420px, 100%);
    padding: 20px;
    border-radius: 14px;
    border: 1px solid rgba(255, 210, 110, .35);
    background: #0d1427;
    color: #e8ecf7;
    font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace;
    box-shadow: 0 0 40px rgba(255, 190, 70, .15);
  }
  .card h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; color: #ffd978; }
  .card textarea {
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    resize: vertical;
    border-radius: 8px;
    border: 1px solid rgba(160, 180, 230, .3);
    background: #060a16;
    color: #f3f5fb;
    font: 15px/1.5 'DejaVu Sans Mono', Menlo, Consolas, monospace;
  }
  .card textarea:focus { outline: 2px solid rgba(255, 210, 110, .6); outline-offset: 1px; }
  .card .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .card button {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: #ffd36e;
    color: #1a1306;
    font: 600 14px 'DejaVu Sans Mono', Menlo, Consolas, monospace;
    cursor: pointer;
  }
  .card button.ghost { background: transparent; color: #c9d2ea; border-color: rgba(160, 180, 230, .3); }
  #wish-view-text { margin: 0 0 10px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  #wish-view-date { margin: 0; font-size: 12px; color: rgba(200, 210, 235, .6); }

  .flying {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 56px;
    pointer-events: none;
    filter: drop-shadow(0 0 12px rgba(255, 220, 140, .8));
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<button id="mailbox" class="mailbox" type="button" aria-label="Write a Christmas wish">
  <span class="icon">📮</span><span class="label">Write a wish</span>
</button>

<div id="overlay" class="overlay" hidden>
  <div id="wish-form" class="card" hidden>
    <h2>📮 Dear Santa…</h2>
    <textarea id="wish-text" rows="5" maxlength="280" placeholder="All I want for Christmas is…" required></textarea>
    <div class="actions">
      <button type="button" class="ghost" data-close>Cancel</button>
      <button type="button" id="wish-send">Send ✉️</button>
    </div>
  </div>
  <div id="wish-view" class="card" hidden>
    <h2>✉️ A wish under the tree</h2>
    <p id="wish-view-text"></p>
    <p id="wish-view-date"></p>
    <div class="actions">
      <button type="button" class="ghost" id="wish-remove">Remove</button>
      <button type="button" data-close>Close</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

const MONO = "'DejaVu Sans Mono', Menlo, Consolas, monospace";
const TAU = Math.PI * 2;

// ---- World ----
const TOP = -1;           // tree tip (world y grows downward)
const BASE = 0.92;        // bottom of the foliage
const GROUND = 1.1;
const RADIUS = 0.85;
const TIERS = 7;
const CAMERA = 3.4;
const SPIN = 0.45;        // radians per second
const LIGHT = normalize(-0.45, -0.55, -0.7);
const SLEIGH_START = 16;
const SLEIGH_PERIOD = 14;
const SLEIGH_FLIGHT = 10;
const FOOTER = 110;       // screen space kept free for the countdown

// ---- Colors ----
const PALETTE = {
  needle:    [80, 215, 105],
  needleDk:  [35, 150, 75],
  trunk:     [140, 90, 50],
  gold:      [255, 205, 90],
  silver:    [215, 225, 240],
  snow:      [240, 246, 255],
  paper:     [245, 235, 210],
  red:       [225, 45, 60],
  light:     [255, 238, 175],
  lightRed:  [255, 90, 90],
  lightBlue: [110, 170, 255],
  lightGreen:[120, 255, 140],
  giftRed:   [205, 40, 55],
  giftBlue:  [70, 120, 220],
  giftGreen: [40, 160, 95],
  star:      [255, 215, 100],
};
const PAL_NAMES = Object.keys(PALETTE);
const LEVELS = 12;
const COLOR_STR = PAL_NAMES.flatMap(name => {
  const [r, g, b] = PALETTE[name];
  return Array.from({ length: LEVELS }, (_, l) => {
    const f = 0.18 + 0.82 * l / (LEVELS - 1);
    return `rgb(${r * f | 0},${g * f | 0},${b * f | 0})`;
  });
});

function palIndex(name) {
  const i = PAL_NAMES.indexOf(name);
  if (i < 0) throw new Error(`Unknown color: ${name}`);
  return i;
}

function normalize(x, y, z) {
  const l = Math.hypot(x, y, z);
  return [x / l, y / l, z / l];
}

function makeSprite([r, g, b]) {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g2 = c.getContext('2d');
  const grad = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.2, `rgba(${r},${g},${b},0.8)`);
  grad.addColorStop(0.5, `rgba(${r},${g},${b},0.18)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  g2.fillStyle = grad;
  g2.fillRect(0, 0, s, s);
  return c;
}

// ---- Scene: 3D points rendered as letters ----
const points = [];
const glows = [];

function addPoint(x, y, z, n, color, ramp, born, opts = {}) {
  const [nx, ny, nz] = normalize(...n);
  points.push({
    x, y, z, nx, ny, nz,
    pal: palIndex(color),
    ramp,
    born,
    twinkle: opts.twinkle || 0,
    phase: Math.random() * TAU,
    billboard: opts.billboard || false,
    shiny: opts.shiny || false,
  });
}

const SPRITES = new Map();
function spriteFor(color) {
  if (!SPRITES.has(color)) SPRITES.set(color, makeSprite(PALETTE[color]));
  return SPRITES.get(color);
}

function addGlow(x, y, z, color, size, alpha, born, opts = {}) {
  glows.push({
    x, y, z, size, alpha, born,
    sprite: spriteFor(color),
    tolerance: opts.tolerance || 0.05,
    twinkle: opts.twinkle || 0,
    phase: Math.random() * TAU,
    billboard: opts.billboard || false,
  });
}

function addSphere(cx, cy, cz, size, color, n, born, opts = {}) {
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const ring = Math.sqrt(1 - y * y);
    const t = i * 2.39996;
    const nx = Math.cos(t) * ring, nz = Math.sin(t) * ring;
    addPoint(cx + nx * size, cy + y * size, cz + nz * size, [nx, y, nz], color, '+*%#@', born, opts);
  }
}

// Tiered cone: each tier flares outward at its lower edge,
// and the edge is lobed into branch tips around the trunk.
function radiusAt(h, a) {
  const tier = (h * TIERS) % 1;
  const lobes = 1 + 0.07 * tier * Math.sin(a * 11 + Math.floor(h * TIERS) * 1.9);
  return RADIUS * h * (0.72 + 0.28 * tier) * lobes;
}

function treeY(h) {
  return TOP + h * (BASE - TOP);
}

function buildTrunk() {
  for (let i = 0; i < 900; i++) {
    const y = 0.3 + Math.random() * (GROUND - 0.3);
    const a = Math.random() * TAU;
    const born = (GROUND - y) / (GROUND - 0.3) * 1.5;
    addPoint(Math.cos(a) * 0.08, y, Math.sin(a) * 0.08, [Math.cos(a), 0, Math.sin(a)], 'trunk', ':=#%', born);
  }
}

function buildNeedles() {
  for (let i = 0; i < 60000; i++) {
    const h = Math.sqrt(Math.random());
    const a = Math.random() * TAU;
    const r = radiusAt(h, a) * (0.82 + 0.18 * Math.random());
    const color = Math.random() < 0.7 ? 'needle' : 'needleDk';
    const born = 1.5 + (1 - h) * 6.5 + Math.random() * 0.4;
    addPoint(Math.cos(a) * r, treeY(h), Math.sin(a) * r, [Math.cos(a), -0.45, Math.sin(a)], color, '.:*##%%', born);
  }
}

function buildGarland() {
  [0, Math.PI].forEach(offset => {
    for (let i = 0; i < 1800; i++) {
      const s = i / 1800;
      const h = 0.06 + s * 0.9;
      const a = s * 5 * TAU + offset;
      const r = radiusAt(h, a) + 0.02;
      addPoint(Math.cos(a) * r, treeY(h), Math.sin(a) * r, [Math.cos(a), -0.3, Math.sin(a)], 'gold', '-~', 7 + (1 - s) * 2);
    }
  });
}

function buildBranchSnow() {
  let placed = 0;
  while (placed < 2600) {
    const h = Math.sqrt(Math.random());
    if ((h * TIERS) % 1 < 0.6) continue;
    const a = Math.random() * TAU;
    const r = radiusAt(h, a) * 1.01;
    addPoint(Math.cos(a) * r, treeY(h), Math.sin(a) * r, [Math.cos(a) * 0.5, -1, Math.sin(a) * 0.5], 'snow', '.:*', 9 + Math.random() * 2);
    placed++;
  }
}

function buildOrnaments() {
  const colors = ['red', 'red', 'gold', 'silver', 'giftBlue'];
  for (let k = 0; k < 44; k++) {
    const h = 0.15 + Math.random() * 0.8;
    const a = Math.random() * TAU;
    const cr = radiusAt(h, a) * 0.97;
    const cx = Math.cos(a) * cr, cy = treeY(h), cz = Math.sin(a) * cr;
    const size = 0.045 + Math.random() * 0.02;
    const color = colors[k % colors.length];
    const born = 9.5 + k * 0.055;
    addSphere(cx, cy, cz, size, color, 320, born, { shiny: true });
    addSphere(cx, cy - size * 1.05, cz, size * 0.28, 'gold', 30, born);
    addGlow(cx, cy, cz, color, size * 3.5, 0.3, born, { tolerance: size * 1.5 });
  }
}

function buildLights() {
  const colors = ['light', 'light', 'light', 'lightRed', 'lightBlue', 'lightGreen', 'gold'];
  for (let i = 0; i < 260; i++) {
    const h = 0.05 + Math.random() * 0.93;
    const a = Math.random() * TAU;
    const r = radiusAt(h, a) * 1.03;
    const color = colors[i % colors.length];
    const x = Math.cos(a) * r, y = treeY(h), z = Math.sin(a) * r;
    const born = 11 + Math.random() * 2;
    addPoint(x, y, z, [Math.cos(a), -0.4, Math.sin(a)], color, 'o@', born, { twinkle: 0.6 });
    addGlow(x, y, z, color, 0.055, 0.6, born, { twinkle: 0.6 });
  }
}

// Red-and-white striped hooks hanging on the branches.
function buildCandyCanes() {
  for (let k = 0; k < 12; k++) {
    const h = 0.25 + Math.random() * 0.7;
    const a = Math.random() * TAU;
    const r = radiusAt(h, a) * 1.02;
    const ox = Math.cos(a), oz = Math.sin(a);   // outward
    const tx = -oz, tz = ox;                    // tangent, for the hook's sideways curl
    const top = treeY(h) - 0.05;
    const born = 10 + k * 0.1;
    const LEN = 0.09, HOOK = 0.025;
    for (let s = 0; s < 1; s += 0.004) {
      const along = s * (LEN + Math.PI * HOOK);
      let dx, dy;
      if (along < LEN) {
        dx = 0; dy = LEN - along;               // straight stem, going up
      } else {
        const t = (along - LEN) / HOOK;         // half circle over the top
        dx = HOOK - Math.cos(t) * HOOK; dy = -Math.sin(t) * HOOK;
      }
      const stripe = Math.floor(along / 0.012) % 2 ? 'red' : 'snow';
      for (let j = 0; j < 3; j++) {
        const jit = (Math.random() - 0.5) * 0.008;
        addPoint(ox * r + tx * (dx + jit), top + dy, oz * r + tz * (dx + jit), [ox, -0.2, oz], stripe, '+*%#', born);
      }
    }
  }
}

// Snow piled on the ground around the trunk.
function buildSnowSkirt() {
  for (let i = 0; i < 2500; i++) {
    const a = Math.random() * TAU;
    const r = 0.12 + Math.sqrt(Math.random()) * 0.7;
    const y = GROUND - 0.035 * (1 - r) - Math.random() * 0.01;
    addPoint(Math.cos(a) * r, y, Math.sin(a) * r, [Math.cos(a) * 0.3, -1, Math.sin(a) * 0.3], 'snow', ':*', 14 + Math.random());
  }
}

function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function buildStar() {
  const cy = TOP - 0.1;
  const outer = 0.13, inner = 0.055;
  const poly = Array.from({ length: 10 }, (_, i) => {
    const r = i % 2 === 0 ? outer : inner;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    return [Math.cos(a) * r, Math.sin(a) * r];
  });
  const born = 13;
  for (let x = -outer; x <= outer; x += 0.005) {
    for (let y = -outer; y <= outer; y += 0.005) {
      if (!pointInPolygon(x, y, poly)) continue;
      addPoint(x, cy + y, 0, [x * 3, y * 3, -1], 'star', '*#%@', born, { billboard: true });
    }
  }
  // Light rays
  [[-1, -1, '\\'], [1, -1, '/'], [-1, 1, '/'], [1, 1, '\\']].forEach(([dx, dy, ch]) => {
    for (let r = 0.17; r < 0.28; r += 0.006) {
      const d = r / Math.SQRT2;
      addPoint(dx * d, cy + dy * d, 0, [0, 0, -1], 'star', ch, born + 0.4, { billboard: true, twinkle: 0.4 });
    }
  });
  addGlow(0, cy, 0, 'star', 0.45, 0.7, born, { billboard: true, tolerance: 1 });
}

function buildGifts() {
  const gifts = [
    [0.4, 0.62, 0.22, 0.18, 'giftRed', 'gold'],
    [1.7, 0.70, 0.18, 0.14, 'gold', 'red'],
    [2.9, 0.60, 0.20, 0.20, 'giftBlue', 'gold'],
    [4.2, 0.68, 0.16, 0.12, 'giftRed', 'gold'],
    [5.3, 0.62, 0.20, 0.16, 'giftGreen', 'gold'],
  ];
  const STEP = 0.009;
  gifts.forEach(([angle, dist, w, h, color, ribbon], k) => {
    const cx = Math.cos(angle) * dist, cz = Math.sin(angle) * dist;
    const top = GROUND - h;
    const born = 15 + k * 0.4;
    const paint = (x, y, z, n) => {
      const tie = Math.abs(x - cx) < w * 0.09 || Math.abs(z - cz) < w * 0.09;
      addPoint(x, y, z, n, tie ? ribbon : color, '+*%#', born);
    };
    for (let u = -w / 2; u <= w / 2; u += STEP) {
      for (let v = -w / 2; v <= w / 2; v += STEP) paint(cx + u, top, cz + v, [0, -1, 0]);
      for (let y = top; y <= GROUND; y += STEP) {
        paint(cx + u, y, cz - w / 2, [0, 0, -1]);
        paint(cx + u, y, cz + w / 2, [0, 0, 1]);
        paint(cx - w / 2, y, cz + u, [-1, 0, 0]);
        paint(cx + w / 2, y, cz + u, [1, 0, 0]);
      }
    }
    // Bow: two loops and a knot on the lid.
    const loop = w * 0.16;
    addSphere(cx - loop, top - loop * 0.7, cz, loop * 0.75, ribbon, 90, born + 0.2);
    addSphere(cx + loop, top - loop * 0.7, cz, loop * 0.75, ribbon, 90, born + 0.2);
    addSphere(cx, top - loop * 0.4, cz, loop * 0.45, ribbon, 40, born + 0.2);
  });
}

buildTrunk();
buildNeedles();
buildGarland();
buildBranchSnow();
buildOrnaments();
buildCandyCanes();
buildLights();
buildStar();
buildSnowSkirt();
buildGifts();

// ---- Wishes: each one becomes an envelope standing under the tree ----
const WISH_KEY = 'christmas-wishes';
// Storage is blocked in sandboxed viewers (e.g. in-app file previews); wishes then last for the visit only.
function loadWishes() {
  try {
    return JSON.parse(localStorage.getItem(WISH_KEY) || '[]');
  } catch (err) {
    console.warn('Wishes will not be saved:', err.message);
    return [];
  }
}
const wishes = loadWishes();
const STATIC_POINTS = points.length;
const envelopes = [];   // { wish, start, end } — range of its points

function saveWishes() {
  try {
    localStorage.setItem(WISH_KEY, JSON.stringify(wishes));
  } catch (err) {
    console.warn('Wishes will not be saved:', err.message);
  }
}

// Spread envelopes around the base on the golden angle, in rings outside the gifts.
function envelopeSpot(i) {
  const a = 0.9 + i * 2.39996;
  const r = 0.98 + 0.16 * Math.floor(i / 9);
  return [Math.cos(a) * r, Math.sin(a) * r, a];
}

function buildEnvelope(wish, i) {
  const [ex, ez, a] = envelopeSpot(i);
  const ox = Math.cos(a), oz = Math.sin(a);   // faces outward
  const tx = -oz, tz = ox;                    // runs along its width
  const HALF_W = 0.12, HEIGHT = 0.16, STEP = 0.005;
  const top = GROUND - HEIGHT;
  const born = 17 + i * 0.15;
  const start = points.length;
  for (let u = -HALF_W; u <= HALF_W; u += STEP) {
    for (let v = 0; v <= HEIGHT; v += STEP) {
      const flapY = HEIGHT / 2 * (1 - Math.abs(u) / HALF_W);   // V-shaped flap
      const seal = Math.hypot(u, v - HEIGHT / 2) < 0.022;
      const flap = Math.abs(v - flapY) < 0.011;
      const color = seal ? 'red' : flap ? 'gold' : 'paper';
      const ramp = seal ? '@' : flap ? '*%' : ':=+#';
      addPoint(ex + tx * u, top + v, ez + tz * u, [ox, -0.2, oz], color, ramp, born);
    }
  }
  envelopes.push({ wish, start, end: points.length });
}

function rebuildEnvelopes() {
  points.length = STATIC_POINTS;
  envelopes.length = 0;
  wishes.forEach(buildEnvelope);
}

rebuildEnvelopes();

// ---- Sleigh pixel art (one letter per pixel) ----
const SLEIGH_ART = [
  '..........rrrr........',
  '.........rrrrrrw......',
  '....uu...wwwwwww......',
  '...uuuu..pkppkpp......',
  '..uuuuuu.ppppppp......',
  '..uuuuuuwwwwwwwww.....',
  'r.uuuuuurwwwwwwwr...rr',
  'rr.uuuurrrrwwwrrrr.rr.',
  'rrrrrrrrrrrrrrrrrrrrr.',
  '.rrrrrrrrrrrrrrrrrrr..',
  '..rrrrrrrrrrrrrrrrr...',
  '...g......g......g....',
  'gggggggggggggggggggg.g',
];
const REINS_ART = Array.from({ length: 13 }, (_, r) => (r === 7 ? 'gggggg' : '......'));
const DEER_ART = [
  '............',
  '............',
  '.....b..b...',
  '......b.b.b.',
  '.......bbb..',
  '.......bbbk.',
  '......bbbbbr',
  'bbbbbbbbb...',
  'bbbbbbbbb...',
  '.bbbbbbbb...',
  '.b.b...b.b..',
  '.b..b..b..b.',
  '............',
];
const ART_COLORS = {
  r: 'rgb(215,45,55)', w: 'rgb(240,240,245)', p: 'rgb(255,200,170)', k: 'rgb(30,30,40)',
  u: 'rgb(125,85,175)', g: 'rgb(255,205,90)', b: 'rgb(155,100,60)',
};

function hcat(...parts) {
  return parts[0].map((_, r) => parts.map(p => p[r]).join(''));
}

const SLEIGH_ROWS = hcat(SLEIGH_ART, REINS_ART, DEER_ART, REINS_ART, DEER_ART);
const SLEIGH_W = SLEIGH_ROWS[0].length;
const SLEIGH_PIXELS = Object.entries(ART_COLORS).map(([key, color]) => {
  const cells = [];
  SLEIGH_ROWS.forEach((row, y) => [...row].forEach((k, x) => {
    if (k === key) cells.push([x, y, '#%@'[Math.random() * 3 | 0]]);
  }));
  return { color, cells };
});

// ---- Layout & buffers ----
let W, H, unit, font, cw, ch, cols, rows, cx, cy;
let zbuf, win, glyphOf, levelOf, buckets, skyStars;

function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textBaseline = 'top';

  unit = Math.min(W * 0.4, (H - FOOTER) * 0.33);
  cx = W / 2;
  cy = (H - FOOTER) * 0.5;

  font = Math.min(Math.max(Math.round(unit / 40), 4), 12);
  ctx.font = `${font}px ${MONO}`;
  cw = ctx.measureText('M').width;
  ch = Math.round(font * 1.15);
  cols = Math.ceil(W / cw);
  rows = Math.ceil(H / ch);

  const n = cols * rows;
  zbuf = new Float32Array(n);
  win = new Int32Array(n);
  glyphOf = new Array(n);
  levelOf = new Uint8Array(n);
  buckets = Array.from({ length: COLOR_STR.length }, () => []);

  skyStars = Array.from({ length: Math.round(cols * rows / 60) }, () => ({
    col: Math.random() * cols | 0,
    row: Math.random() * rows * 0.8 | 0,
    glyph: '..+*'[Math.random() * 4 | 0],
    phase: Math.random() * TAU,
  }));
}

// ---- Falling snow ----
const flakes = Array.from({ length: 140 }, () => ({
  x: Math.random(),
  y: Math.random(),
  v: 0.02 + Math.random() * 0.05,
  glyph: Math.random() < 0.4 ? '*' : '.',
  drift: Math.random() * TAU,
}));

// ---- Render passes ----
function rasterize(t, cosA, sinA) {
  zbuf.fill(Infinity);
  win.fill(-1);
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.born > t) continue;
    const c = p.billboard ? 1 : cosA, s = p.billboard ? 0 : sinA;
    const rx = p.x * c - p.z * s;
    const rz = p.x * s + p.z * c;
    const persp = CAMERA / (CAMERA + rz);
    const col = Math.floor((cx + rx * persp * unit) / cw);
    const row = Math.floor((cy + p.y * persp * unit) / ch);
    if (col < 0 || col >= cols || row < 0 || row >= rows) continue;
    const idx = row * cols + col;
    if (rz >= zbuf[idx]) continue;
    zbuf[idx] = rz;
    win[idx] = i;
  }
}

const SNOW_PAL = palIndex('snow');

function shadeCells(t, time, cosA, sinA) {
  buckets.forEach(b => (b.length = 0));
  let letters = 0;
  for (let idx = 0; idx < win.length; idx++) {
    const i = win[idx];
    if (i < 0) continue;
    const p = points[i];
    const c = p.billboard ? 1 : cosA, s = p.billboard ? 0 : sinA;
    const nx = p.nx * c - p.nz * s;
    const nz = p.nx * s + p.nz * c;
    const lambert = Math.max(0, nx * LIGHT[0] + p.ny * LIGHT[1] + nz * LIGHT[2]);
    const depthFade = 1 - 0.35 * Math.min(Math.max((zbuf[idx] + 1) / 2, 0), 1);
    let shade = Math.min(1, (0.3 + 0.8 * lambert) * depthFade);
    if (p.twinkle) shade *= 1 - p.twinkle * (0.5 + 0.5 * Math.sin(time * 4 + p.phase));
    if (t - p.born < 0.3) shade = 1; // freshly typed letters flash
    const glint = p.shiny && lambert > 0.93;
    const level = glint ? LEVELS - 1 : Math.min(LEVELS - 1, Math.floor(shade * LEVELS));
    glyphOf[idx] = glint ? '@' : p.ramp[Math.min(p.ramp.length - 1, Math.floor(shade * p.ramp.length))];
    buckets[(glint ? SNOW_PAL : p.pal) * LEVELS + level].push(idx);
    letters++;
  }
  return letters;
}

function drawCells() {
  ctx.font = `${font}px ${MONO}`;
  buckets.forEach((cells, k) => {
    if (!cells.length) return;
    ctx.fillStyle = COLOR_STR[k];
    for (const idx of cells) {
      ctx.fillText(glyphOf[idx], (idx % cols) * cw, Math.floor(idx / cols) * ch);
    }
  });
}

function drawSky(time) {
  ctx.font = `${font}px ${MONO}`;
  ctx.fillStyle = 'rgb(200,210,240)';
  for (const s of skyStars) {
    if (win[s.row * cols + s.col] >= 0) continue;
    ctx.globalAlpha = 0.25 + 0.25 * Math.sin(time * 1.5 + s.phase);
    ctx.fillText(s.glyph, s.col * cw, s.row * ch);
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  const groundRow = Math.floor((cy + GROUND * unit) / ch);
  ctx.font = `${font}px ${MONO}`;
  ctx.fillStyle = 'rgb(140,155,190)';
  for (let row = groundRow; row < rows; row++) {
    const k = row - groundRow;
    const glyph = k % 2 ? '=' : '-';
    let line = '';
    for (let col = 0; col < cols; col++) line += win[row * cols + col] >= 0 ? ' ' : glyph;
    ctx.globalAlpha = 0.12 + 0.3 * k / Math.max(1, rows - groundRow);
    ctx.fillText(line, 0, row * ch);
  }
  ctx.globalAlpha = 1;
}

function drawGlows(t, time, cosA, sinA) {
  ctx.globalCompositeOperation = 'lighter';
  for (const g of glows) {
    if (g.born > t) continue;
    const c = g.billboard ? 1 : cosA, s = g.billboard ? 0 : sinA;
    const rx = g.x * c - g.z * s;
    const rz = g.x * s + g.z * c;
    const persp = CAMERA / (CAMERA + rz);
    const sx = cx + rx * persp * unit;
    const sy = cy + g.y * persp * unit;
    const col = Math.floor(sx / cw), row = Math.floor(sy / ch);
    if (col < 0 || col >= cols || row < 0 || row >= rows) continue;
    if (rz - g.tolerance > zbuf[row * cols + col]) continue; // hidden behind the tree
    let alpha = g.alpha * Math.min(1, (t - g.born) * 3);
    if (g.twinkle) alpha *= 1 - g.twinkle * (0.5 + 0.5 * Math.sin(time * 4 + g.phase));
    const size = g.size * persp * unit;
    ctx.globalAlpha = alpha;
    ctx.drawImage(g.sprite, sx - size, sy - size, size * 2, size * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawBackdrop() {
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, unit * 1.6);
  grad.addColorStop(0, 'rgba(110,130,200,0.12)');
  grad.addColorStop(1, 'rgba(110,130,200,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawSleigh(t) {
  if (t < SLEIGH_START) return;
  const u = ((t - SLEIGH_START) % SLEIGH_PERIOD) / SLEIGH_FLIGHT;
  if (u > 1) return;
  const px = Math.min(Math.max(W / 160, 2.5), 6);
  const artW = SLEIGH_W * px;
  const x0 = -artW + u * (W + artW);
  const y0 = H * 0.2 + Math.sin(u * TAU * 2) * px * 3;
  ctx.font = `${px * 1.6}px ${MONO}`;
  for (const { color, cells } of SLEIGH_PIXELS) {
    ctx.fillStyle = color;
    for (const [x, y, glyph] of cells) ctx.fillText(glyph, x0 + x * px, y0 + y * px * 1.4);
  }
}

function drawSnow(dt, time) {
  ctx.font = `${font}px ${MONO}`;
  ctx.fillStyle = 'rgb(240,245,255)';
  for (const f of flakes) {
    f.y += f.v * dt;
    if (f.y > 1) { f.y = 0; f.x = Math.random(); }
    ctx.globalAlpha = f.glyph === '*' ? 0.8 : 0.5;
    ctx.fillText(f.glyph, f.x * W + Math.sin(time * 0.8 + f.drift) * 10, f.y * H);
  }
  ctx.globalAlpha = 1;
}

// Milliseconds until Dec 25 00:00 local time; 0 on Christmas Day.
function msUntilChristmas() {
  const now = new Date();
  if (now.getMonth() === 11 && now.getDate() === 25) return 0;
  let xmas = new Date(now.getFullYear(), 11, 25);
  if (now > xmas) xmas = new Date(now.getFullYear() + 1, 11, 25);
  return xmas - now;
}

function drawCountdown() {
  const ms = msUntilChristmas();
  const total = Math.floor(ms / 1000);
  const pad = n => String(n).padStart(2, '0');
  const big = ms === 0
    ? 'Merry Christmas!'
    : `${Math.floor(total / 86400)}d ${pad(Math.floor(total / 3600) % 24)}h ${pad(Math.floor(total / 60) % 60)}m ${pad(total % 60)}s`;
  const size = Math.round(Math.min(Math.max(W / 16, 20), 36));

  ctx.textAlign = 'center';
  ctx.save();
  ctx.font = `bold ${size}px ${MONO}`;
  ctx.fillStyle = 'rgb(255,220,120)';
  ctx.shadowColor = 'rgba(255,190,70,0.8)';
  ctx.shadowBlur = 16;
  ctx.fillText(big, W / 2, H - size - 44);
  ctx.restore();
  if (ms > 0) {
    ctx.font = `13px ${MONO}`;
    ctx.fillStyle = 'rgba(220,228,245,0.75)';
    ctx.fillText('until Christmas', W / 2, H - 36);
  }
  ctx.textAlign = 'left';
}

function drawHud(t, letters, lights) {
  const size = 11;
  ctx.font = `${size}px ${MONO}`;
  ctx.fillStyle = 'rgba(255,110,140,0.85)';
  ctx.textAlign = 'right';
  ctx.fillText(`t ${t.toFixed(2)}s`, W - 16, 16);
  ctx.textAlign = 'left';

  const lines = [
    `rotation ${((angle * 180 / Math.PI) % 360).toFixed(2)}°`,
    `letters ${letters.toLocaleString('en-US')}`,
    `lights ${lights}`,
    `wishes ${wishes.length}`,
  ];
  ctx.fillStyle = 'rgba(200,210,235,0.6)';
  lines.forEach((line, i) => ctx.fillText(line, 16, 16 + i * (size + 3)));
}

// ---- Main loop ----
const buildStart = performance.now();
let last = buildStart;
let angle = 0;

// The visible envelope nearest the given screen point, using last frame's letter grid.
function envelopeAt(x, y) {
  const REACH = 32;   // px — finger-sized, since letters can be only a few px wide
  let best = null, bestDist = REACH;
  const c0 = Math.max(0, Math.floor((x - REACH) / cw)), c1 = Math.min(cols - 1, Math.floor((x + REACH) / cw));
  const r0 = Math.max(0, Math.floor((y - REACH) / ch)), r1 = Math.min(rows - 1, Math.floor((y + REACH) / ch));
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const i = win[r * cols + c];
      if (i < STATIC_POINTS) continue;   // empty cell or part of the tree
      const dist = Math.hypot((c + 0.5) * cw - x, (r + 0.5) * ch - y);
      if (dist >= bestDist) continue;
      best = envelopes.find(e => i >= e.start && i < e.end);
      bestDist = dist;
    }
  }
  return best;
}

const overlay = document.getElementById('overlay');
const wishForm = document.getElementById('wish-form');
const wishText = document.getElementById('wish-text');
const wishView = document.getElementById('wish-view');
let openWish = null;

function showCard(card) {
  wishForm.hidden = card !== wishForm;
  wishView.hidden = card !== wishView;
  overlay.hidden = false;
}

function closeOverlay() {
  overlay.hidden = true;
  openWish = null;
}

function readWish(wish) {
  openWish = wish;
  document.getElementById('wish-view-text').textContent = wish.text;
  document.getElementById('wish-view-date').textContent =
    `Sent ${new Date(wish.date).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}`;
  showCard(wishView);
}

// A ✉️ pops up mid-screen and flies down to where the envelope will stand.
function flyEnvelope(i, done) {
  const [x, z] = envelopeSpot(i);
  const c = Math.cos(angle), s = Math.sin(angle);
  const rx = x * c - z * s, rz = x * s + z * c;
  const persp = CAMERA / (CAMERA + rz);
  const tx = cx + rx * persp * unit;
  const ty = cy + (GROUND - 0.06) * persp * unit;
  const el = document.createElement('div');
  el.className = 'flying';
  el.textContent = '✉️';
  document.body.append(el);
  const at = (px, py, scale) => `translate(${px}px, ${py}px) translate(-50%, -50%) scale(${scale})`;
  el.animate([
    { transform: at(W / 2, H / 2, 0.2), opacity: 0 },
    { transform: at(W / 2, H / 2, 1.4), opacity: 1, offset: 0.25 },
    { transform: at(tx, ty, 0.3), opacity: 1 },
  ], { duration: 1800, easing: 'ease-in-out' }).onfinish = () => {
    el.remove();
    done();
  };
}

document.getElementById('mailbox').addEventListener('click', () => {
  wishText.value = '';
  showCard(wishForm);
  wishText.focus();
});

document.getElementById('wish-send').addEventListener('click', () => {
  const text = wishText.value.trim();
  if (!text) return;
  wishes.push({ text, date: new Date().toISOString() });
  saveWishes();
  closeOverlay();
  flyEnvelope(wishes.length - 1, rebuildEnvelopes);
});

document.getElementById('wish-remove').addEventListener('click', () => {
  wishes.splice(wishes.indexOf(openWish), 1);
  saveWishes();
  rebuildEnvelopes();
  closeOverlay();
});

overlay.addEventListener('click', e => {
  if (e.target === overlay || e.target.hasAttribute('data-close')) closeOverlay();
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !overlay.hidden) closeOverlay();
});

canvas.addEventListener('pointermove', e => {
  canvas.style.cursor = envelopeAt(e.clientX, e.clientY) ? 'pointer' : 'default';
});

// Hold the tree still while a finger or mouse button is down, so a letter is easy to hit.
let pressed = false;
canvas.addEventListener('pointerdown', () => { pressed = true; });
window.addEventListener('pointerup', () => { pressed = false; });
window.addEventListener('pointercancel', () => { pressed = false; });

canvas.addEventListener('click', e => {
  const env = envelopeAt(e.clientX, e.clientY);
  if (env) readWish(env.wish);
});

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const time = now / 1000;
  const t = (now - buildStart) / 1000;

  if (!pressed) angle += SPIN * dt;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);

  rasterize(t, cosA, sinA);
  const letters = shadeCells(t, time, cosA, sinA);
  const lights = glows.filter(g => g.born <= t && g.twinkle).length;

  ctx.clearRect(0, 0, W, H);
  drawBackdrop();
  drawSky(time);
  drawGround();
  drawCells();
  drawGlows(t, time, cosA, sinA);
  drawSleigh(t);
  drawSnow(dt, time);
  drawHud(t, letters, lights);
  drawCountdown();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
