<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Christmas Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-inner: #0b1a2e;
    --bg-outer: #02040a;
    --text: #ffe9b0;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg-outer);
  }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg-inner) 0%, var(--bg-outer) 70%);
    touch-action: none;
    cursor: grab;
  }
  body:active { cursor: grabbing; }
  canvas { display: block; width: 100vw; height: 100vh; }
  h1 {
    position: fixed;
    left: 0; right: 0;
    bottom: 6vh;
    margin: 0;
    padding: 0 16px;
    text-align: center;
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 96px);
    color: var(--text);
    text-shadow: 0 0 12px rgba(255, 200, 90, .8), 0 0 40px rgba(255, 160, 40, .5);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<h1>Merry Christmas</h1>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

// ---- World settings ----
const TREE_TOP = -1;          // world y of the tree tip
const TREE_HEIGHT = 2;        // world units from tip to base
const BASE_RADIUS = 0.85;
const CAMERA_DIST = 3.4;
const AUTO_SPIN = 0.35;       // radians per second

const COLORS = {
  green:  [60, 220, 110],
  deep:   [20, 150, 80],
  gold:   [255, 200, 80],
  warm:   [255, 245, 220],
  red:    [255, 60, 70],
  blue:   [90, 170, 255],
  pink:   [255, 120, 200],
};

let W, H, unit;

function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  unit = Math.min(W, H * 0.7) * 0.42;
}

// Pre-rendered soft glow sprite for one color.
function makeSprite([r, g, b]) {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g2 = c.getContext('2d');
  const grad = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.15, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.45, `rgba(${r},${g},${b},0.25)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  g2.fillStyle = grad;
  g2.fillRect(0, 0, s, s);
  return c;
}

const SPRITES = Object.fromEntries(
  Object.entries(COLORS).map(([name, rgb]) => [name, makeSprite(rgb)])
);

// ---- Tree particles ----
function particle(t, angle, radius, size, color, twinkleSpeed) {
  return {
    x: Math.cos(angle) * radius,
    y: TREE_TOP + t * TREE_HEIGHT,
    z: Math.sin(angle) * radius,
    size,
    sprite: SPRITES[color],
    phase: Math.random() * Math.PI * 2,
    speed: twinkleSpeed,
  };
}

function buildTree() {
  const points = [];

  // Foliage: more points toward the base, biased to the cone surface.
  for (let i = 0; i < 2600; i++) {
    const t = Math.sqrt(Math.random());
    const radius = t * BASE_RADIUS * (0.35 + 0.65 * Math.sqrt(Math.random()));
    const color = Math.random() < 0.6 ? 'green' : 'deep';
    points.push(particle(t, Math.random() * Math.PI * 2, radius, 3 + Math.random() * 3, color, 1 + Math.random() * 2));
  }

  // Two spiral light garlands wrapping the tree.
  const TURNS = 6;
  [['gold', 0], ['warm', Math.PI]].forEach(([color, offset]) => {
    for (let i = 0; i < 520; i++) {
      const t = 0.04 + (i / 520) * 0.96;
      const angle = t * TURNS * Math.PI * 2 + offset;
      points.push(particle(t, angle, t * BASE_RADIUS * 1.04, 5, color, 3 + Math.random() * 3));
    }
  });

  // Ornaments: big bright baubles on the surface.
  const ornamentColors = ['red', 'gold', 'blue', 'pink'];
  for (let i = 0; i < 70; i++) {
    const t = 0.12 + Math.random() * 0.86;
    const color = ornamentColors[i % ornamentColors.length];
    points.push(particle(t, Math.random() * Math.PI * 2, t * BASE_RADIUS * 1.02, 12 + Math.random() * 6, color, 0.8 + Math.random()));
  }

  return points;
}

// ---- Snow ----
function buildSnow(count) {
  return Array.from({ length: count }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: 0.6 + Math.random() * 2.2,
    vy: 0.02 + Math.random() * 0.05,
    drift: Math.random() * Math.PI * 2,
  }));
}

const tree = buildTree();
const snow = buildSnow(220);

// ---- Interaction: drag to spin ----
let angle = 0;
let dragX = null;
window.addEventListener('pointerdown', e => { dragX = e.clientX; });
window.addEventListener('pointermove', e => {
  if (dragX === null) return;
  angle += (e.clientX - dragX) * 0.008;
  dragX = e.clientX;
});
window.addEventListener('pointerup', () => { dragX = null; });
window.addEventListener('pointercancel', () => { dragX = null; });

// ---- Rendering ----
function project(x, y, z, cosA, sinA) {
  const rx = x * cosA - z * sinA;
  const rz = x * sinA + z * cosA;
  const scale = CAMERA_DIST / (CAMERA_DIST + rz);
  return {
    sx: W / 2 + rx * scale * unit,
    sy: H * 0.42 + y * scale * unit,
    scale,
    depth: rz,
  };
}

function drawStar(cx, cy, outer, time) {
  const inner = outer * 0.45;
  const spin = time * 0.6;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(spin) * 0.15);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.shadowColor = 'rgba(255, 210, 90, 1)';
  ctx.shadowBlur = 30 + Math.sin(time * 3) * 10;
  ctx.fillStyle = '#ffe28a';
  ctx.fill();
  ctx.restore();

  const halo = outer * 4;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(SPRITES.gold, cx - halo, cy - halo, halo * 2, halo * 2);
  ctx.globalCompositeOperation = 'source-over';
}

function drawGroundGlow() {
  const cx = W / 2;
  const cy = H * 0.42 + (TREE_TOP + TREE_HEIGHT) * unit + 6;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, unit * 1.1);
  grad.addColorStop(0, 'rgba(255, 210, 120, 0.25)');
  grad.addColorStop(1, 'rgba(255, 210, 120, 0)');
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, 0.18);
  ctx.translate(-cx, -cy);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, unit * 1.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawTree(time, cosA, sinA) {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of tree) {
    const { sx, sy, scale, depth } = project(p.x, p.y, p.z, cosA, sinA);
    const depthFade = 0.35 + 0.65 * (1 - (depth + 1) / 2);
    const twinkle = 0.55 + 0.45 * Math.sin(time * p.speed + p.phase);
    const size = p.size * scale;
    ctx.globalAlpha = depthFade * twinkle;
    ctx.drawImage(p.sprite, sx - size, sy - size, size * 2, size * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawSnow(dt, time) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  for (const f of snow) {
    f.y += f.vy * dt;
    if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
    const x = f.x * W + Math.sin(time * 0.8 + f.drift) * 12;
    ctx.globalAlpha = 0.4 + f.r / 4;
    ctx.beginPath();
    ctx.arc(x, f.y * H, f.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const time = now / 1000;

  if (dragX === null) angle += AUTO_SPIN * dt;
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);

  ctx.clearRect(0, 0, W, H);
  drawGroundGlow();
  drawTree(time, cosA, sinA);

  const tip = project(0, TREE_TOP - 0.08, 0, cosA, sinA);
  drawStar(tip.sx, tip.sy, unit * 0.09, time);

  drawSnow(dt, time);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
